version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: salon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-salon_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-salon_password}
      POSTGRES_DB: ${DATABASE_NAME:-salon_backend}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database-init:/docker-entrypoint-initdb.d
      - ../../database/schema/database-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    networks:
      - salon_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USERNAME:-salon_user} -d ${DATABASE_NAME:-salon_backend}",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis (for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: salon_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - salon_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}

  # NestJS Backend (Development)
  backend-dev:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: dev
    container_name: salon_backend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      # Database Mode Configuration
      DB_MODE: ${DB_MODE:-local}
      # Local Database
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-salon_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-salon_password}
      DATABASE_NAME: ${DATABASE_NAME:-salon_backend}
      # Supabase Configuration
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME}
      # Other Services
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      OTP_PROVIDER: ${OTP_PROVIDER:-bhashsms}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_VERIFY_SERVICE_ID: ${TWILIO_VERIFY_SERVICE_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/v1/auth/google/callback}
      # S3/DigitalOcean Spaces Configuration
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_CDN_ENDPOINT: ${S3_CDN_ENDPOINT}
      S3_PUBLIC_READ: ${S3_PUBLIC_READ:-true}
      # BhashSMS Configuration
      BHASHSMS_API_URL: ${BHASHSMS_API_URL}
      BHASHSMS_USERNAME: ${BHASHSMS_USERNAME}
      BHASHSMS_PASSWORD: ${BHASHSMS_PASSWORD}
      BHASHSMS_SENDER_ID: ${BHASHSMS_SENDER_ID}
      # Payment Gateway (Razorpay)
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      # Firebase Configuration
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-./style-plus-project-firebase-adminsdk-fbsvc-0272b1d083.json}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ../..:/app
      - /app/node_modules
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - salon_network
    profiles:
      - dev

  # NestJS Backend (Production)
  backend-prod:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: runner
    container_name: salon_backend_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database Mode Configuration
      DB_MODE: ${DB_MODE:-local}
      # Local Database
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-salon_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-salon_password}
      DATABASE_NAME: ${DATABASE_NAME:-salon_backend}
      # Supabase Configuration
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME}
      # Other Services
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      OTP_PROVIDER: ${OTP_PROVIDER:-bhashsms}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_VERIFY_SERVICE_ID: ${TWILIO_VERIFY_SERVICE_ID}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://api.yourdomain.com/api/v1/auth/google/callback}
      # S3/DigitalOcean Spaces Configuration
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_CDN_ENDPOINT: ${S3_CDN_ENDPOINT}
      S3_PUBLIC_READ: ${S3_PUBLIC_READ:-true}
      # BhashSMS Configuration
      BHASHSMS_API_URL: ${BHASHSMS_API_URL}
      BHASHSMS_USERNAME: ${BHASHSMS_USERNAME}
      BHASHSMS_PASSWORD: ${BHASHSMS_PASSWORD}
      BHASHSMS_SENDER_ID: ${BHASHSMS_SENDER_ID}
      # Payment Gateway (Razorpay)
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      # Firebase Configuration
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-./style-plus-project-firebase-adminsdk-fbsvc-0272b1d083.json}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - salon_network
    profiles:
      - prod

  # Nginx (Production Load Balancer/Proxy)
  nginx:
    image: nginx:alpine
    container_name: salon_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on: []
    networks:
      - salon_network
    profiles:
      - dev
      - prod

  # pgAdmin (Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: salon_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@salon.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - salon_network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  backend_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  salon_network:
    driver: bridge
